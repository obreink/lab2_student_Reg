{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Students</h3>
    <a class="btn btn-primary" href="{{ url_for('register_student') }}">Register New Student</a>
</div>

{% if students %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody>
    {% for s in students %}
        <tr>
            <td>{{ s.student_id }}</td>
            <td>{{ s.name }}</td>
            <td>{{ s.email }}</td>
            <td><a class="btn btn-sm btn-secondary" href="{{ url_for('student_detail', student_id=s.id) }}">View</a></td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p>No students registered yet.</p>
{% endif %}
{% endblock %}
